# =============================================================================
# R6 - Juntar tudo, conferir (ablação) e reajustar C/gamma
# -----------------------------------------------------------------------------
# !!! NÃO RODAR ANTES DE ATUALIZAR O BASELINE (combinação dos vencedores R1-R5) !!!
#
# Perguntas:
#   1. Os vencedores funcionam juntos, e cada um ainda é necessário? (ablação: cada
#      experimento tira UM vencedor e compara com a combinação completa)
#   2. Depois das mudanças nos dados (R2) e nas colunas (R4), o C/gamma do R3 ainda é o
#      melhor? (como a R5 da árvore de decisão: uma grade pequena em volta do vencedor)
# Critério: roc_auc e recall, contra a combinação completa (--ref). Uma ablação sem diferença
#           significativa = aquele vencedor pode sair (fica a mais simples).
#
# Os overrides abaixo são EXEMPLOS: escreva um por vencedor que não seja o padrão.
#
# Fechar a rodada:
#   python compare.py --rodada R6_ --ref <pasta do R6_baseline ou do vencedor do R5> --salvar
#   python compare.py --rodada R6_ --ref <mesma pasta> --metric recall --salvar
# =============================================================================

baseline_name: R6_baseline

baseline:                     # combinação dos vencedores R1-R5
  zeros: to_nan               # R2 (trata o RestingBP = 0)
  missing_flags: none         # R2_ausentes
  imputer: median             # R2_ausentes
  features: none              # R2_oldpeak
  drop_cols: cholesterol_fastingbs   # R2_atalho
  encoding: onehot
  scaler: standard            # R1
  selection: {name: kbest, k: 6}     # R4
  model: {name: svm, kernel: linear, C: 0.01, class_weight: {0: 1, 1: 2}}   # R3 + R5

experiments:
  # --- ablação: cada experimento tira (ou devolve) UM vencedor ---
  # Sem o peso do R5: é exatamente a config do vencedor do R4 (pulada pelo hash).
  # Entra no compare por --incluir 20261117_153215_ec5fa1_R4_kbest__k=6

  - name: R6_sem_selecao              # R4: volta para as 16 colunas
    override: {selection: none}

  - name: R6_com_fastingbs            # R2: devolve o FastingBS (ressalva do R2)
    override: {drop_cols: cholesterol}

  - name: R6_kernel_poly2             # R3: o melhor kernel, já com peso e seleção
    override:
      model: {name: svm, kernel: poly, degree: 2, C: 0.1, class_weight: {0: 1, 1: 2}}

  # --- reajuste do C: com o peso, o C efetivo dos doentes dobrou ---
  - name: R6_reajuste_C0.003
    override:
      model: {name: svm, kernel: linear, C: 0.003, class_weight: {0: 1, 1: 2}}

  - name: R6_reajuste_C0.03
    override:
      model: {name: svm, kernel: linear, C: 0.03, class_weight: {0: 1, 1: 2}}